[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livereact"
version = "0.1.0"
description = "Beat-reactive DMX stage-lighting controller for live DJ sets"
readme = "README.md"
license = { file = "LICENSE" }
# Target 3.12 (the analysis pins it for prebuilt python-rtmidi wheels at the
# hardware-MIDI phase). 3.13 is fine for the hardware-free phases (0-6).
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Installed per phase, not all at once. Phases 0-6 need none of these except dev.
ui = ["PySide6>=6.6"]                                   # Phase 2: console + visualizer
net = ["pyartnet>=2.0"]                                 # Art-Net output backend (hardware-free testing)
hardware = ["pyserial>=3.5", "mido>=1.3", "python-rtmidi>=1.5", "sounddevice>=0.5", "numpy>=2.0"]  # Phase 7
# NOTE: python-prodj-link is git-only (not on PyPI). It will be vendored / pinned
# to a SHA at the hardware phase, behind the InputSource interface.
# sounddevice + numpy (docs/14): real audio capture/FFT analysis. VERIFIED ON
# HARDWARE (2026-08-31) — the XDJ-XZ exposes a USB audio interface over the
# same USB-B cable already carrying MIDI, no new hardware/port needed.
sim = ["numpy>=2.0"]                                    # offline replay harness (livereact.sim); ffmpeg binary on PATH; librosa optional
dev = ["pytest>=8.0"]

[project.scripts]
livereact = "livereact.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livereact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
